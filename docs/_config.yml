theme: just-the-docs

title: Microcontroller Workshop DTI '26
color_scheme: light

callouts_level: quiet
callouts:
  highlight:
    color: green
  highlight-yellow:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: green
  note-purple:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

# External navigation links
nav_external_links:
  - title: AI Workshop Assistant
    url: https://www.perplexity.ai/search/dti-workshop-helper-T0eH2gNyRM2elfBJcprRJw
    hide_icon: false          # show the external link icon
    opens_in_new_tab: true

plugins:
  - jekyll-redirect-from

sass:
  quiet_deps: true
  silence_deprecations: ["import"]
