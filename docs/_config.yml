theme: just-the-docs

title: Microcontroller Workshop DTI '26
color_scheme: light

callouts_level: quiet
callouts:
  highlight:
    color: green
  highlight-yellow:
    color: yellow
  important:
    title: Important
    color: blue
  new:
    title: New
    color: green
  note:
    title: Note
    color: green
  note-purple:
    title: Note
    color: purple
  warning:
    title: Warning
    color: red

plugins:
  - jekyll-redirect-from

sass:
  quiet_deps: true
  silence_deprecations: ["import"]
